name: Build TiViLook Tizen WGT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config.xml and app.js
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('config.xml')"
          node --check app.js

      - name: Package TiViLook-test.wgt
        run: |
          rm -f TiViLook-test.wgt
          zip -r9 TiViLook-test.wgt config.xml index.html style.css app.js icon.png
          unzip -l TiViLook-test.wgt

      - name: Upload WGT artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiViLook-test-wgt
          path: TiViLook-test.wgt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tizen-v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" TiViLook-test.wgt \
            --title "TiViLook Samsung TV Test $TAG" \
            --notes "Тестовая сборка TiViLook (.wgt) для Samsung Tizen TV (AVPlay)."
