<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TiViLook</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <object id="av-player" type="application/avplayer"></object>
    <video id="html5-player" autoplay playsinline></video>

    <div id="clock-badge">00:00</div>

    <div id="status-badge">
        <span id="signal-bars">
            <span class="s-bar b1"></span>
            <span class="s-bar b2"></span>
            <span class="s-bar b3"></span>
            <span class="s-bar b4"></span>
        </span>
        <span id="status-text">Запуск...</span>
    </div>

    <!-- Left SIDE Panel (Groups & Channels) -->
    <div id="side-panel" class="panel hidden">
        <div class="side-header">
            <div class="side-brand">TiViLook</div>
            <div id="side-counter">0 / 0</div>
            <div class="side-tabs">
                <span id="tab-groups" class="side-tab">Группы</span>
                <span id="tab-channels" class="side-tab active">Каналы</span>
            </div>
            <div id="side-group-caption">Все каналы</div>
        </div>
        <div id="side-list"></div>
        <div class="side-footer">
            <span class="hint-key">▲▼</span> Листать
            <span class="hint-key">◀▶</span> Группы
            <span class="hint-dot dot-yellow"></span> ★ Избр.
            <span class="hint-dot dot-green"></span> Зеркало
            <span class="hint-dot dot-red"></span> Обновить
        </div>
    </div>

    <!-- Right INFO Panel -->
    <div id="info-panel" class="panel hidden">
        <div class="info-title">Info</div>
        <div class="info-block">
            <div class="info-row" id="info-ch">Канал: —</div>
            <div class="info-row" id="info-group">Группа: —</div>
            <div class="info-row info-gap" id="info-res">Разрешение: —</div>
            <div class="info-row" id="info-proto">Поток: —</div>
            <div class="info-row" id="info-state">Состояние: —</div>
            <div class="info-row info-gap" id="info-catalog">Каталог: —</div>
            <div class="info-row" id="info-engine">Плеер: —</div>
            <div class="info-row" id="info-tizen">Система: —</div>
        </div>
        <div class="diag-title">Журнал событий</div>
        <div id="diag-log"></div>
    </div>

    <!-- Bottom OSD Bar -->
    <div id="osd-bar" class="panel hidden">
        <div id="osd-channel-name">Канал</div>
        <div id="osd-channel-meta">Подключение...</div>
    </div>

    <!-- Toast -->
    <div id="toast-box" class="hidden"></div>

    <!-- Splash Screen (16-ray eye, NO text) -->
    <div id="splash-overlay">
        <img id="splash-icon" src="icon.png" alt="">
    </div>

    <script type="text/javascript" src="app.js"></script>
</body>
</html>
