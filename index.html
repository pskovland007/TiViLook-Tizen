<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TiViLook</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <!-- Samsung native hardware video surface -->
    <object id="av-player" type="application/avplayer"></object>
    <!-- Fallback HTML5 player for desktop browser preview -->
    <video id="html5-player" autoplay playsinline></video>

    <!-- Top-left clock -->
    <div id="clock-badge">00:00</div>

    <!-- Top-right signal / status pill -->
    <div id="status-badge">
        <span id="status-dot"></span>
        <span id="status-text">Готов</span>
    </div>

    <!-- Left Sidebar: Test Channels -->
    <div id="side-panel" class="panel">
        <div class="panel-header">
            <div class="panel-title">TiViLook Test</div>
            <div class="panel-subtitle">Проверка Samsung TV (AVPlay)</div>
        </div>
        <div id="channel-list"></div>
        <div class="panel-footer">
            <span>▲▼ Выбор</span>
            <span>OK Пуск</span>
            <span>▶ Info</span>
            <span>◀ Закрыть</span>
        </div>
    </div>

    <!-- Right Panel: Stream Info & Diagnostics -->
    <div id="info-panel" class="panel hidden">
        <div class="panel-title center-title">Info</div>
        <div id="info-rows">
            <div class="info-row" id="info-ch">Канал: —</div>
            <div class="info-row" id="info-engine">Плеер: —</div>
            <div class="info-row info-gap" id="info-res">Разрешение: —</div>
            <div class="info-row" id="info-state">Состояние: —</div>
            <div class="info-row" id="info-tizen">Система: —</div>
        </div>
        <div class="diag-title">Журнал событий</div>
        <div id="diag-log"></div>
    </div>

    <!-- Bottom OSD Banner -->
    <div id="osd-bar" class="panel hidden">
        <div id="osd-channel-name">Канал</div>
        <div id="osd-channel-meta">Подключение...</div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-box" class="hidden"></div>

    <!-- Splash Screen (TiViLook 16-ray eye, NO text) -->
    <div id="splash-overlay">
        <img id="splash-icon" src="icon.png" alt="">
    </div>

    <script type="text/javascript" src="app.js"></script>
</body>
</html>
